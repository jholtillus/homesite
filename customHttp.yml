# AWS Amplify response headers (applies to every app built from this repository).
# The Panomachea web game (panomachea/public/play/) is a Godot export: make sure the engine is
# served as WebAssembly, and let browsers cache the large files.
customHeaders:
  - pattern: '/play/*.wasm'
    headers:
      - key: 'Content-Type'
        value: 'application/wasm'
      - key: 'Cache-Control'
        value: 'public, max-age=86400'
  - pattern: '/play/*.pck'
    headers:
      - key: 'Content-Type'
        value: 'application/octet-stream'
      - key: 'Cache-Control'
        value: 'public, max-age=86400'
  # Old theseuscomic.com reader addresses on the Theseus site: small pages that forward to /read/.
  - pattern: '/comic.php'
    headers:
      - key: 'Content-Type'
        value: 'text/html; charset=utf-8'
  - pattern: '/index.php'
    headers:
      - key: 'Content-Type'
        value: 'text/html; charset=utf-8'
