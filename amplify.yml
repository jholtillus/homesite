# AWS Amplify build settings. This file overrides the build settings in the Amplify console.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Astro's dependencies (undici) need Node 22.19+; the default image has 22.18.
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
