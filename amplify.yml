# AWS Amplify build settings. This file overrides the build settings in the Amplify console.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Astro's dependencies (undici) need Node 22.19+; the default image has 22.18.
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # One repository, one Amplify app per site. The project apps set the environment
        # variable SITE=theseus or SITE=panomachea; every app publishes dist/.
        - if [ "$SITE" = "theseus" ] || [ "$SITE" = "panomachea" ]; then npm run build:$SITE && rm -rf dist && mv dist-$SITE dist; else npm run build; fi
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
